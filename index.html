<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bistrô Prestígio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;800&display=swap">
<style>
:root{--bg:#dff0e7;--card:#fffdf7;--ink:#1d2b29;--mut:#5d6f6b;--line:#e3d9c3;--acc:#e2482d;--gold:#f4c95d;--hd:#17413b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2622;--card:#1b3732;--ink:#f2efe6;--mut:#a7bcb6;--line:#2c4d46;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f2622;--card:#1b3732;--ink:#f2efe6;--mut:#a7bcb6;--line:#2c4d46;color-scheme:dark}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:800 15px/1.35 Nunito,system-ui,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:30}
h1,h2,h3,b{font-family:Fredoka,system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding-bottom:4px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hd);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
h1{font-size:19px;margin:0}header span{font-size:13px;color:var(--gold)}
.pl{display:flex;gap:6px;padding:10px;overflow-x:auto}
.chip{flex:1 0 108px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 8px;display:flex;flex-direction:column;font-size:13px}
.chip.me{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.card{background:var(--card);border-radius:18px;margin:10px;padding:12px;border:1px solid var(--line)}
h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:2px 0}
.inv{display:flex;gap:6px}.inv span{flex:1;background:var(--bg);border-radius:12px;text-align:center;padding:6px 0;font-size:20px}.inv b{display:block;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.tag{font-style:normal;background:var(--bg);border-radius:20px;padding:2px 8px;font-size:12px}
.die{font:700 54px Fredoka,sans-serif;text-align:center;background:var(--gold);color:#3a2b00;border-radius:20px;padding:10px;margin:6px 0;min-height:90px}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ing{font-size:34px;background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:10px 4px;color:var(--ink);min-height:84px}
.ing small{display:block;font:800 11px Nunito}.ing:not(:disabled){border-color:var(--acc);animation:pulse 1.2s infinite alternate}
.ing:disabled{opacity:.4}
@keyframes pulse{to{transform:scale(1.05)}}
.tbl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cust{background:var(--bg);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:5px;text-align:center}
.cust.crit{background:#2b1d3a;color:#fff;outline:3px solid var(--gold)}
.face{font-size:38px}.rw{font-weight:800}.rq{display:flex;justify-content:center;gap:4px;align-items:center;flex-wrap:wrap}
.ing2{font-size:26px}.rq em{font-size:11px;color:var(--mut)}.ats{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.btn,.sm{font:700 17px Fredoka,sans-serif;border:0;border-radius:16px;background:var(--acc);color:#fff;min-height:52px;padding:0 16px;cursor:pointer}
.sm{min-height:40px;font-size:14px;background:var(--hd)}
button:disabled{opacity:.45;cursor:not-allowed}
.bar{position:sticky;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--hd);display:grid;gap:8px;z-index:20;color:#fff}
.bar .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar .btn.alt{background:var(--gold);color:#3a2b00}
.bar p{margin:0;font-size:13px;text-align:center}
summary{font:700 16px Fredoka;cursor:pointer}#lg{font-size:13px;color:var(--mut);max-height:220px;overflow:auto;margin-top:6px}#lg div{padding:2px 0;border-bottom:1px dashed var(--line)}
#phase,#modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;text-align:center}
#phase{background:var(--hd);color:#fff;pointer-events:all}#phase.on{display:grid;animation:ov 1.9s both}
.ph b{display:block;font-size:min(14vw,64px);color:var(--gold);animation:zm 1.9s cubic-bezier(.2,.9,.3,1.2) both}.ph small{font-size:18px;opacity:.85;animation:sl 1.9s both;display:block}
@keyframes ov{0%{opacity:0}12%,80%{opacity:1}100%{opacity:0}}
@keyframes zm{0%{transform:scale(.2);opacity:0}28%{transform:scale(1.1);opacity:1}70%{transform:scale(1)}100%{transform:scale(1.7);opacity:0}}
@keyframes sl{0%{transform:translateY(-40px);opacity:0}30%,75%{transform:none;opacity:.9}100%{opacity:0}}
#modal{background:#000a}#modal.on{display:grid}.box{background:var(--card);padding:18px;border-radius:20px;width:min(86vw,360px);display:grid;gap:8px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--gold);color:#3a2b00;padding:10px 16px;border-radius:14px;z-index:40;display:none;max-width:90vw;text-align:center}
@media(prefers-reduced-motion:reduce){.ing:not(:disabled){animation:none}.ph b,.ph small{animation:none}}
.btn.off{background:var(--mut)}.dbg{margin:10px;background:#2b1d3a;color:#fff;border-radius:14px;padding:8px}.dp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px}.dpi{display:inline-flex;gap:4px;align-items:center;background:#0005;border-radius:10px;padding:3px 6px}.dbg select{max-width:100%;min-height:38px;border-radius:8px;font:inherit}.dbg .sm{min-height:36px;padding:0 10px;background:var(--acc)}.pl{flex-direction:column;overflow:visible}.chip{flex:none}.chip details{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}.chip summary{font:700 14px Fredoka}.mini{font:700 13px Fredoka;border:0;border-radius:10px;background:var(--hd);color:#fff;min-height:38px;padding:0 10px}.stk{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.box small{margin-top:4px;font-weight:700}.btn:disabled{background:var(--mut)}.cnt{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:4px 0}small{display:block}.cust.crit small{opacity:.9;font-size:11px}
#home{position:fixed;inset:0;z-index:45;background:#c8f1ff;display:grid;place-items:center;overflow:hidden}#home.off{display:none}

.pk{position:absolute;left:34.4%;width:35.5%;height:11.5%;border:0;background:transparent;color:#6b3d03;font:700 calc(var(--w)*.046) Fredoka,system-ui,sans-serif;line-height:1.05;padding:0 4%;cursor:pointer;text-shadow:0 1px 0 #ffd88a;transition:transform .15s,filter .15s}

function wants(p){
 const w=[0,0,0,0,0],A=p.arch,cr=G.table.find(c=>c.crit);
 G.table.forEach(c=>{
  if(c.crit)return;let k=1;
  if(A=='Rápido')k=c.pr<=3?2:.3;else if(A=='Lento')k=c.pr>=4?2:.3;else if(A=='Atrativo')k=1+c.at.filter(a=>p.hand.includes(a)).length;
  if(A=='Babá Ovo'&&cr)k=cr.t=='m'?(c.mo==cr.x?5:.2):cr.t=='n'?1.5:cr.t=='u'?((c.req.any||c.req.all).includes(cr.x)?5:.2):1;
  const r=c.req.any||c.req.all;r.forEach(t=>{w[t]+=k/(c.req.any?r.length:1)});
 });
 if(A=='Babá Ovo'&&cr&&cr.t=='u')w[cr.x]+=10;
 if(A=='Malandro'||A=='Arnold')G.players.forEach(q=>{
  if(q===p||(A=='Arnold'&&q.cpu))return;
  G.table.forEach(c=>{if(c.crit||c.pr<3)return;const r=c.req.any||c.req.all,miss=r.filter(t=>q.inv[t]==0);miss.forEach(t=>{w[t]+=miss.length==1?3:.8})});
 });
 return w;
}
function cscore(p,c){
 const A=p.arch,cr=G.table.find(x=>x.crit);let s=c.pr+Math.random()*.5;
 if(A=='Rápido')s=10-c.pr+Math.random()*.5;
 if(A=='Atrativo')s=c.pr+3*c.at.filter(a=>p.hand.includes(a)).length+Math.random();
 if(A=='Malandro'||A=='Arnold')s+=G.players.some(q=>q!==p&&!(A=='Arnold'&&q.cpu)&&can(q,c))?3:0;
 if(A=='Babá Ovo'&&cr)s+=cr.t=='m'?(c.mo==cr.x?8:0):cr.t=='n'?3:cr.t=='u'?((c.req.any||c.req.all).includes(cr.x)?8:0):0;
 return s;
}

  if(bt<0)break;const j=G.pool.indexOf(bt);if(j>=0)G.pool.splice(j,1);else G.bank.splice(G.bank.indexOf(bt),1);p.inv[bt]++;n++}

function cpuCarreg(p){
 const w=wants(p),opts=sh(G.pool.slice()).slice(0,6),n=1+rnd(6);
 opts.sort((a,b)=>w[b]-w[a]);let g=0;
 opts.forEach(t=>{if(g<n&&p.inv[t]<p.cap){const j=G.pool.indexOf(t);if(j>=0){G.pool.splice(j,1);p.inv[t]++;g++}}});
 useC(p,'carreg');log('🚚 '+p.name+' tirou '+n+' no D6 e levou '+g+' ingrediente(s)');

function cpuConc(p){
 let best=null;
 G.players.forEach(q=>{if(q===p)return;q.won.forEach((c,j)=>{if(c.crit||!can(p,c)||c.pr<2)return;const s=c.pr+(p.arch=='Arnold'&&!q.cpu?6:0)+Math.random();if(!best||s>best.s)best={q,c,j,s}})});
 if(!best)return;
 const {q,c,j}=best,pay=t=>{p.inv[t]--;p.used[t]++;if(q.inv[t]<q.cap)q.inv[t]++;else G.pool.push(t)};
 if(c.req.any)pay(c.req.any.filter(t=>p.inv[t]>0).sort((a,b)=>p.inv[b]-p.inv[a])[0]);else rq(p,c).all.forEach(pay);
 const lost=c.pr+(c.bonus||0),kc=q.won.filter(k=>k.crit&&cmatch(k,c));
 q.won.splice(j,1);kc.forEach(k=>{k.got=Math.max(0,(k.got||0)-1)});q.pr=Math.max(0,q.pr-lost-kc.length);q.ns--;q.bym[c.mo]--;
 const bonus=c.at.filter(a=>p.hand.includes(a)).length;c.bonus=bonus;p.bar=null;p.won.push(c);p.pr+=c.pr+bonus;p.ns++;p.bym[c.mo]++;critBonus(p,c);
 useC(p,'conc');log('🕵️ '+p.name+' atendeu '+c.name+' de '+q.name+': +'+c.pr+'⭐');
}
function cpuCards(p,ph){
 if(hasV(p,'gela')>=0&&p.cap==3&&(p.inv.some(n=>n>=3)||rnd(3)==0)){useC(p,'gela');p.cap=6}
 if(hasV(p,'reserva')>=0&&rnd(2)){const L=G.table.filter(c=>!c.crit&&!(c.lock>=0));if(L.length){const c=L.sort((a,b)=>cscore(p,b)-cscore(p,a))[0];c.lock=G.players.indexOf(p);useC(p,'reserva');log('🔒 '+p.name+' reservou '+c.name)}}
 if(hasV(p,'estudo')>=0&&rnd(3)==0){const L=G.table.map((c,i)=>i).filter(i=>!(G.table[i].lock>=0));if(L.length){const i=L.sort((a,b)=>cscore(p,G.table[a])-cscore(p,G.table[b]))[0];G.table[i]=drawC(G.table[i]);useC(p,'estudo')}}
 if(ph=='serve'){
  if(hasV(p,'garcom')>=0&&!p.gar&&G.table.filter(c=>can(p,c)).length>=2){useC(p,'garcom');p.gar=1}
  if(hasV(p,'barg')>=0&&!p.bar){
   outer:for(const c of G.table){if(c.crit||c.pr<4||(c.lock>=0&&G.players[c.lock]!==p)||can(p,c))continue;
    for(let k=0;k<c.req.all.length;k++){p.bar={c,i:k};if(can(p,c)){useC(p,'barg');break outer}}p.bar=null}
  }
  if(hasV(p,'conc')>=0)cpuConc(p);
 }
 checkCrit();if(G.st!='end'&&p.pr>=G.goal)win(p);
 if(ph=='buy'&&G.st=='buy'){
  const room=p.inv.some(n=>n<p.cap);
  if(hasV(p,'enc')>=0&&room)cpuEnc(p);
  if(hasV(p,'carreg')>=0&&room&&G.pool.length&&rnd(2))cpuCarreg(p);
 }
}

function emo(n){
 const t=n.nodeValue,par=n.parentNode;RX.lastIndex=0;
 if(!par||!RX.test(t)||(par.closest&&par.closest('option,select,textarea,script,style,title,[data-ne]')))return;
 RX.lastIndex=0;const fr=document.createDocumentFragment(),die=par.closest('.die');let last=0,m;

 }

 par.replaceChild(fr,n);
}

<script src="/socket.io/socket.io.js"></script>
<script>
/* Conexão do Servidor */
const RAW=Math.random.bind(Math),urnd=n=>Math.floor(RAW()*n),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let SOCK=null,ROOM=null,TOK=null,LAST=0,WAIT=0,RUN=false,ACTQ=[],ANSQ=[],ANSW=[];
const vp=()=>ON&&G?G.players[MY]:cur();
const myT=p=>!ON||cur()===p;
const curI=()=>!G?-1:G.st=='buy'?G.order[G.turn]:G.st=='serve'?G.sorder[G.sturn]:-1;
const REAL={rollD10,d10go,rollBuy,pick,serve,pass,buyA,buyV,useV};
function seedRng(s){let a=s>>>0;Math.random=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

function chk(fn,by){
 if(!G)return false;const s=G.st;
 if(fn=='d10go')return s=='d10'&&!!G.d10done;
 if(fn=='rollD10')return s=='d10'&&!G.d10done&&G.cont[G.d10r.length]===by;
 if(s!='buy'&&s!='serve')return false;
 if(curI()!==by)return false;
 if(fn=='rollBuy')return s=='buy'&&!G.bt.rolled;
 if(fn=='pick')return s=='buy';
 if(fn=='serve'||fn=='pass')return s=='serve';
 return true;
}
function ui(fn,...a){
 if(!ON)return REAL[fn](...a);
 if(WAIT||!chk(fn,MY))return;
 WAIT=1;setTimeout(()=>WAIT=0,2500);
 SOCK.emit('act',{fn,a});
}
async function runAct(){
 if(RUN)return;RUN=true;
 try{while(ACTQ.length){
  while(G&&(busy||G.ck||G.st=='lock'))await sleep(50);
  if(!G){ACTQ.length=0;break}
  const e=ACTQ.shift();if(!chk(e.fn,e.by))continue;
  try{await REAL[e.fn](...e.a)}catch(x){console.error(x)}
 }}finally{RUN=false}
}
function onEv(e){
 if(!e||e.seq<=LAST)return;LAST=e.seq;
 if(e.t=='ans'){ANSQ.push(e);const w=ANSW.shift();if(w)w();return}
 if(e.by===MY)WAIT=0;
 ACTQ.push(e);runAct();
}
const waitAns=()=>new Promise(r=>{const t=()=>{if(ANSQ.length)r(ANSQ.shift());else ANSW.push(t)};t()});
const hideToast=()=>{clearTimeout(toast.i);$('#toast').style.display='none'};
async function askD(own,t,o){
 if(!ON)return ask(t,o);
 if(own===MY){const v=await ask(t,o);SOCK.emit('ans',{i:o.findIndex(x=>x.v===v)})}
 else toast('⏳ Aguardando '+G.players[own].name+'…',120000);
 const e=await waitAns();hideToast();return o[e.i].v;
}

/* Interface da Sala Online */
const lobEl=()=>{let o=document.getElementById('lob');if(!o){o=document.createElement('div');o.id='lob';o.className='opt';document.body.appendChild(o)}return o};
const closeLob=()=>{const o=document.getElementById('lob');if(o)o.remove();HM.classList.remove('off')};
const leaveRoom=()=>location.reload();

function online(){
 if(!SOCK)return ask('🌐 Jogar Online<small>Conectando ao servidor...</small>',[{l:'Ok',v:0}]);
 HM.classList.add('off');
 lobEl().innerHTML=`<div class=glass><button class="sm gh" onclick="closeLob()">🏠 Menu</button><h2>🌐 Modo Online</h2><button class=btn onclick="setupOnlineCreate()">➕ Criar Sala</button><button class=btn onclick="joinUI()">🔑 Entrar em Sala</button></div>`;
}

function joinUI(){
 lobEl().innerHTML=`<div class=glass><button class="sm gh" onclick="online()">↩️ Voltar</button><h2>🔑 Entrar em Sala</h2><input id=jc style="font:700 18px Fredoka,sans-serif;border:2px solid #d97706;border-radius:10px;padding:10px;text-align:center;width:100%;text-transform:uppercase" placeholder="Código (ex: SALA-123)" maxlength=12 autocomplete=off><input id=jn style="font:700 18px Fredoka,sans-serif;border:2px solid #d97706;border-radius:10px;padding:10px;text-align:center;width:100%" placeholder="Seu nome" maxlength=14 autocomplete=off onkeydown="if(event.key=='Enter')joinRoom()"><button class=btn onclick="joinRoom()">Entrar</button></div>`;
}

function joinRoom(){
 const code=$('#jc').value,name=$('#jn').value;
 if(!code.trim()||!name.trim())return toast('Digite o código e o seu nome.');
 SOCK.emit('join',{code,name},r=>{if(!r||r.err)return toast(r&&r.err||'Erro ao entrar.');ROOM=r.code;TOK=r.tok;MY=r.my;showLobby(r.lobby)});
}

function setupOnlineCreate(){
 SU.on=1;G=null;SU.step=0;SU.ed=-1;render();HM.classList.add('off');
}

function createRoom(){
 if(!SOCK)return toast('Sem conexão com o servidor.');
 const cpu=[...Array(SU.np)].map((_,i)=>!!SU.cpu[i]);
 if(cpu.every(x=>x))return toast('Defina pelo menos 1 vaga para jogador humano (JOG).');
 SOCK.emit('create',{goal:SU.goal,np:SU.np,names:SU.names.slice(0,SU.np),cpu},r=>{
  if(!r||r.err)return toast(r&&r.err||'Erro ao criar sala.');
  ROOM=r.code;TOK=r.tok;MY=r.my;$('#app').innerHTML='';showLobby(r.lobby);
 });
}

function showLobby(L){
 const hum=L.seats.filter(s=>!s.cpu),filled=hum.filter(s=>s.filled).length,need=hum.length,ready=filled==need,host=L.host===MY;
 lobEl().innerHTML=`<div class=glass><h2>🌐 Sala Online</h2><div class=die style="font-size:34px;min-height:70px">${L.code}</div><small>Compartilhe este código com seus amigos</small><small><b>Jogadores conectados: ${filled}/${need}</b></small><ul class=pls>${L.seats.map(s=>`<li><span>${s.cpu?'🤖 '+s.name:s.filled?'👤 '+s.name+(s.on?'':' (off)'):'⏳ Aguardando...'}</span><b>${s.cpu?'CPU':'JOG'}</b></li>`).join('')}</ul>${host?`<button class=btn ${ready?'':'disabled'} onclick="startRoom()">▶️ Iniciar Partida</button>`:`<small>${ready?'Aguardando o criador iniciar…':'Aguardando outros entrarem…'}</small>`}<button class="btn off" onclick="leaveRoom()">↩️ Sair</button></div>`;
}

const startRoom=()=>SOCK.emit('start',r=>{if(r&&r.err)toast(r.err)});

/* Conexão do Socket */
try{SOCK=io()}catch(e){}
if(SOCK){
 SOCK.on('lobby',L=>{if(!ON&&ROOM===L.code)showLobby(L)});
 SOCK.on('start',m=>{
  if(ON)return;
  ON=true;MY=m.my;LAST=0;ACTQ=[];ANSQ=[];ANSW=[];seedRng(m.seed);
  SU.goal=m.goal;SU.np=m.np;SU.names=m.names;SU.cpu=m.cpu;
  closeLob();HM.classList.add('off');busy=false;newGame(m.np);
 });
 SOCK.on('ev',onEv);SOCK.on('evs',a=>a.forEach(onEv));
 SOCK.on('pres',m=>{if(ON&&G&&G.players[m.seat])toast((m.on?'🟢 ':'🔴 ')+G.players[m.seat].name+(m.on?' voltou.':' desconectou.'),3500)});
 SOCK.on('closed',()=>{toast('A sala foi encerrada.');setTimeout(()=>location.reload(),1500)});
 SOCK.on('connect',()=>{if(TOK&&ROOM)SOCK.emit('resume',{code:ROOM,tok:TOK,last:LAST},r=>{if(r&&r.err)toast(r.err)})});
}
